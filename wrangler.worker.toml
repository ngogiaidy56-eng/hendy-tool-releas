# Standalone Cloudflare Worker API + Vite static assets.
name = "hendy-tool-releas-api"
main = "./src/worker.ts"
compatibility_date = "2026-10-23"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[vars]
ENVIRONMENT = "production"
APP_NAME = "Hendy Tools Platform & App Downloader"
