name: Build and publish Hendy web release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version, for example 3.2.1
        required: true
        type: string
      notes:
        description: Release notes shown in the app store
        required: true
        default: Web improvements and bug fixes.
        type: string
      publish_to_store:
        description: Publish the real ZIP artifact to Cloudflare R2
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hendy-web-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-package:
    name: Build and package the actual web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production website
        run: npm run build

      - name: Package website and calculate checksums
        run: npm run package:web-release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hendy-store-web-${{ inputs.version }}
          path: |
            release-artifacts/hendy-store-web-v${{ inputs.version }}.zip
            release-artifacts/hendy-store-web-v${{ inputs.version }}.zip.sha256
            release-artifacts/release-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate publishing configuration
        if: ${{ inputs.publish_to_store }}
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$RELEASE_PUBLISH_TOKEN" ]; then
            echo "::error::Add the RELEASE_PUBLISH_TOKEN GitHub Actions secret before publishing to the store."
            exit 1
          fi

      - name: Publish artifact to Worker API and R2
        if: ${{ inputs.publish_to_store }}
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          PUBLISH_URL: https://hendy-tool-releas.ngogiaidy56.workers.dev/api/v1/admin/publish
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$PUBLISH_URL" \
            -H "Authorization: Bearer $RELEASE_PUBLISH_TOKEN" \
            -F "appName=Hendy Store Web" \
            -F "appSlug=hendy-store-web" \
            -F "version=$RELEASE_VERSION" \
            -F "platform=web" \
            -F "releaseNotes=$RELEASE_NOTES" \
            -F "file=@release-artifacts/hendy-store-web-v$RELEASE_VERSION.zip;type=application/zip" \
            --output publish-result.json
          cat publish-result.json
