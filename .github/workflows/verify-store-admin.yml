name: Verify Storefront and Admin Console

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-store-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and dual-page production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Run Worker route and Access-auth tests
        run: npm test

      - name: Build separate storefront and admin HTML entrypoints
        run: npm run build

      - name: Assert both applications were emitted independently
        run: |
          test -s dist/index.html
          test -s dist/admin.html
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const store = readFileSync("dist/index.html", "utf8"); const admin = readFileSync("dist/admin.html", "utf8"); if (store === admin) throw new Error("Store and Admin HTML must be separate documents"); if (!store.includes("Hendy Store")) throw new Error("Storefront branding missing"); if (!admin.includes("Hendy Admin Console")) throw new Error("Admin branding missing"); if (!admin.includes("/assets/")) throw new Error("Admin production asset entry missing"); console.log("Verified distinct Storefront and Admin production HTML entries.");'

