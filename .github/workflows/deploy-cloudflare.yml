name: Deploy to Cloudflare Pages and Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Select which Cloudflare service to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - pages
          - worker

permissions:
  contents: read

concurrency:
  group: hendy-cloudflare-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Validate standalone Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config=wrangler.worker.toml

      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: hendy-tools-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    name: Deploy Pages frontend and Functions
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'pages' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (includes Pages Functions)
        uses: actions/checkout@v4

      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: hendy-tools-dist
          path: dist/

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4"
          command: pages deploy dist --project-name=hendy-tool-releas --branch=main --config=wrangler.toml

  deploy-worker:
    name: Deploy standalone Worker API
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'worker' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built frontend assets
        uses: actions/download-artifact@v4
        with:
          name: hendy-tools-dist
          path: dist/

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4"
          command: deploy --config=wrangler.worker.toml
