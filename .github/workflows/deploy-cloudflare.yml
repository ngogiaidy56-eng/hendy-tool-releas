name: Deploy optional Cloudflare Pages project

# The primary Worker is deployed by Cloudflare Workers Builds on every push to main.
# This workflow is only for the separate Pages Direct Upload project.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-pages-direct-upload
  cancel-in-progress: true

jobs:
  build-and-deploy-pages:
    name: Build and deploy Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Keep the optional Pages distribution storefront-only
        run: |
          # The private Admin Console is served only by the Worker after Access JWT validation.
          rm -f dist/admin.html
          test -s dist/index.html
          test ! -e dist/admin.html

      - name: Deploy Pages Direct Upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4"
          command: pages deploy dist --project-name=hendy-tool-releas --branch=main
