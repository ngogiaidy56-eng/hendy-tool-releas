name: Deploy Hendy Store to Cloudflare Workers and 3 Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'public/**'
      - 'index.html'
      - 'admin.html'
      - 'ops.html'
      - 'package*.json'
      - 'bun.lock*'
      - 'tsconfig*.json'
      - 'vite*.config.ts'
      - 'scripts/**'
      - 'wrangler*.toml'
      - '.github/workflows/**'
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-cloudflare]

permissions:
  contents: read

concurrency:
  group: hendy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, provision Worker and deploy 3 Pages
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_ADMIN_EMAILS: ${{ vars.CF_ACCESS_ADMIN_EMAILS || secrets.CF_ACCESS_ADMIN_EMAILS }}
      RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      APP_BASE_URL: https://hendy-tool-releas.ngogiaidy56.workers.dev
      PAGES_BASE_URL: https://hendy-web-user.pages.dev
      ADMIN_PAGES_BASE_URL: https://hendy-web-admin.pages.dev
      OPS_PAGES_BASE_URL: https://hendy-operations.pages.dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub Actions secret."; exit 1; fi
          if ! [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then echo "::error::Set CLOUDFLARE_ACCOUNT_ID to a 32-character Cloudflare account ID."; exit 1; fi
          if [ -z "${CF_ACCESS_ADMIN_EMAILS:-}" ]; then echo "::error::Set CF_ACCESS_ADMIN_EMAILS to real admin emails, comma-separated."; exit 1; fi
          echo "Deployment credentials are present; secret values are not printed."
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate deployment contract
        run: npm run check:deployment
      - name: Typecheck and test
        run: |
          npm run lint
          npm test
      - name: Build Worker assets (Store and protected Admin entry)
        run: |
          npm run build
          node scripts/verify-store-admin-build.mjs
          node scripts/prepare-worker-assets.mjs
      - name: Provision R2 and the three Pages projects
        run: node scripts/provision-cloudflare-resources.mjs
      - name: Bootstrap Worker and R2 binding
        run: npx --yes wrangler@4 deploy --config=wrangler.bootstrap.toml
      - name: Provision Access applications and Worker runtime secrets
        id: access
        run: node scripts/provision-cloudflare-access.mjs --output "$RUNNER_TEMP/worker-secrets.json"
      - name: Validate Worker configuration before deployment
        run: npx --yes wrangler@4 deploy --dry-run --config=wrangler.toml --secrets-file "${{ steps.access.outputs.secrets_file }}"
      - name: Deploy Worker API and protected Admin origin
        run: npx --yes wrangler@4 deploy --config=wrangler.toml --secrets-file "${{ steps.access.outputs.secrets_file }}"
      - name: Build independent Pages applications and API gateways
        run: |
          npm run build:pages
          npm run build:pages:functions
          npm run verify:pages
      - name: Deploy public web-user Pages
        run: npx --yes wrangler@4 pages deploy dist-pages/web-user --project-name=hendy-web-user --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$GITHUB_SHA" --no-bundle
      - name: Deploy protected web-admin Pages
        run: npx --yes wrangler@4 pages deploy dist-pages/web-admin --project-name=hendy-web-admin --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$GITHUB_SHA" --no-bundle
      - name: Deploy protected operations Pages
        run: npx --yes wrangler@4 pages deploy dist-pages/operations --project-name=hendy-operations --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$GITHUB_SHA" --no-bundle
      - name: Smoke-test Worker and all Pages
        run: node scripts/smoke-test-cloudflare.mjs
      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Hendy platform deployment"
            echo
            echo "- Worker API: https://hendy-tool-releas.ngogiaidy56.workers.dev/"
            echo "- Web User: https://hendy-web-user.pages.dev/"
            echo "- Web Admin (Cloudflare Access): https://hendy-web-admin.pages.dev/"
            echo "- Operations (Cloudflare Access): https://hendy-operations.pages.dev/"
            echo "- Admin/Operations API calls are proxied through Pages Functions to the Worker."
            echo "- Deployment stage result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
