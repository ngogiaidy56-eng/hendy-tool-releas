name: Deploy Cloudflare Workers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['workers/**','packages/db-schema/**']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [workers/backend-api/wrangler.toml, workers/edge-router/wrangler.toml, workers/self-healing-bot/wrangler.toml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config ${{ matrix.config }}
