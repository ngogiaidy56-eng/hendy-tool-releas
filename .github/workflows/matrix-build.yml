name: Matrix Build and Release Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matrix-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web, android-validation, ios-validation, windows-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build
      - name: Validate signing configuration without exposing credentials
        if: matrix.target != 'web'
        shell: bash
        run: |
          echo "Target: ${{ matrix.target }}"
          echo "Signing happens only in platform-specific release jobs with configured signing secrets."
          echo "This workflow does not fabricate signing keys or claim unsigned artifacts are signed."
